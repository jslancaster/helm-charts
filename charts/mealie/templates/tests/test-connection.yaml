apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mealie.fullname" . }}-test-connection"
  labels:
    {{- include "mealie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          echo "Testing connection to Mealie service..."
          wget --spider --timeout=10 --tries=3 {{ include "mealie.fullname" . }}:{{ .Values.service.port }}
          if [ $? -eq 0 ]; then
            echo "SUCCESS: Mealie service is reachable"
            exit 0
          else
            echo "FAILED: Could not connect to Mealie service"
            exit 1
          fi
  restartPolicy: Never
