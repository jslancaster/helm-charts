{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mealie.fullname" . }}-test-serviceaccount"
  labels:
    {{- include "mealie.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "mealie.serviceAccountName" . }}
  containers:
    - name: test
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          echo "Testing service account configuration..."

          # Check if service account token is mounted
          {{- if .Values.serviceAccount.automount }}
          if [ -f "/var/run/secrets/kubernetes.io/serviceaccount/token" ]; then
            echo "✓ Service account token is mounted"
          else
            echo "FAILED: Service account token should be mounted but is not found"
            exit 1
          fi
          {{- else }}
          if [ ! -f "/var/run/secrets/kubernetes.io/serviceaccount/token" ]; then
            echo "✓ Service account token is not mounted (as expected)"
          else
            echo "FAILED: Service account token should not be mounted but was found"
            exit 1
          fi
          {{- end }}

          # Check namespace file
          if [ -f "/var/run/secrets/kubernetes.io/serviceaccount/namespace" ]; then
            NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
            echo "✓ Service account namespace: $NAMESPACE"
          fi

          echo "SUCCESS: Service account is properly configured"
          exit 0
  restartPolicy: Never
{{- end }}
